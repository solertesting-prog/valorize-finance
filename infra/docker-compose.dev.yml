# Servicios de apoyo para desarrollo local:
#   docker compose -f infra/docker-compose.dev.yml up -d
name: valorize-dev
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: valorize, POSTGRES_PASSWORD: valorize, POSTGRES_DB: valorize }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U valorize"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
             mc mb -p local/valorize-private;
             mc anonymous set none local/valorize-private;
             mc cors set local/valorize-private /cors.json || true"
    volumes: [./minio-cors.json:/cors.json:ro]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes: { pgdata: {}, minio: {} }
