# Producción en un único host (VM) con Docker Compose.
# Para mayor escala, las mismas imágenes funcionan en ECS/Kubernetes con PostgreSQL y Redis gestionados.
#
#   cp infra/.env.production.example infra/.env.production   # y rellena secretos
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production up -d --build
name: valorize
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile, args: { API_INTERNAL_URL: http://api:4000 } }
    image: valorize/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    image: valorize/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=20
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TRUST_PROXY: 1
    deploy:
      replicas: 2
      resources: { limits: { memory: 768M } }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=512MB", "-c", "log_min_duration_statement=500"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"], interval: 5s, retries: 20 }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]

  # Copia de seguridad diaria cifrada de PostgreSQL a S3 (retención gestionada con reglas de ciclo de vida del bucket).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes: [./backup.sh:/backup.sh:ro]
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache aws-cli gnupg >/dev/null && echo '15 3 * * * /bin/sh /backup.sh' | crontab - && crond -f -l 8"]
    depends_on: [postgres]

volumes: { pgdata: {}, redis: {}, caddy_data: {}, caddy_config: {} }
