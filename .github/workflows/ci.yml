name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: valorize, POSTGRES_PASSWORD: valorize, POSTGRES_DB: valorize }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U valorize" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://valorize:valorize@localhost:5432/valorize?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @valorize/shared build
      - run: pnpm --filter @valorize/api exec prisma generate
      - name: Migraciones aplican limpias y coinciden con el schema
        run: |
          pnpm --filter @valorize/api exec prisma migrate deploy
          pnpm --filter @valorize/api exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: pnpm -r typecheck
      - run: pnpm --filter @valorize/api test
      - run: pnpm --filter @valorize/api build
      - run: pnpm --filter @valorize/web build

  images:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/api/Dockerfile, push: true, tags: "ghcr.io/${{ github.repository }}/api:${{ github.sha }},ghcr.io/${{ github.repository }}/api:latest" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: apps/web/Dockerfile, push: true, tags: "ghcr.io/${{ github.repository }}/web:${{ github.sha }},ghcr.io/${{ github.repository }}/web:latest" }
